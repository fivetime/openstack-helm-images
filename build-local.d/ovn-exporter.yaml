- job:
    name: build-local-ovn-exporter
    vars:
      container_images:
        - context: ovn-exporter
          repository: openstackhelm/ovn-exporter
          container_filename: Dockerfile
          arch: [linux/amd64, linux/arm64]
          tags: [latest]
          build_args:
            - OVN_EXPORTER_REF=b70dfc71b804e2eb4f55e436de06501220b90ee6
