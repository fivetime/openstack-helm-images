---
# Fork-only Nova compute image for the external Incus system-container driver.
# The Incus daemon runs in its own privileged Helm DaemonSet; this image
# contains only Nova, the driver, its SDK, patches, and integration tools.

- job:
    name: build-local-nova-incus
    description: Build the Nova Incus system-container compute image.
    vars:
      container_images:
        - context: .
          repository: openstackhelm/nova-incus
          container_filename: nova/Dockerfile.incus
          arch:
            - linux/amd64
            - linux/arm64
          tags:
            - 2026.2-alpine_3.24
          build_args:
            - NOVA_REF=8df1922926ddf949d681e10670dba7bc731701d3
            - NOVA_INCUS_REF=7209b5e9e27cf860f6d57e20716edfe54abff040
            - INCUS_SDK_REF=b9fd81ee6cd52298def32d800bc1165ae2149615
            - REQUIREMENTS_REF=bab6cd8e3b9a5ac61b98aa7016c7d98b3000a8ac

- job:
    name: build-local-nova-osvif
    description: >-
      Upstream Nova compute image with os-vif's create_tap disabling IPv6 on the
      tap before bringing it up (the tap carries the instance MAC, so the host's
      DAD NS for the guest link-local otherwise lands in the guest queue).
      Only nova_compute uses it; see OpenStack-Helm-Deploy.md §9.4.
    vars:
      container_images:
        - context: nova
          repository: openstackhelm/nova-osvif
          container_filename: Dockerfile.osvif
          arch:
            - linux/amd64
          tags:
            - 2026.1-ubuntu_noble
          build_args:
            - OS_VIF_REF=4dafdda9b259ad4334344bb2ad8bc8758516a21f

- job:
    name: build-local-nova-incus-control
    description: Add the Incus RPC and Manila contracts to the Nova control image.
    vars:
      container_images:
        - context: nova
          repository: openstackhelm/nova-incus-control
          container_filename: Dockerfile.incus-control
          arch:
            - linux/amd64
          tags:
            - 2026.2-ubuntu_resolute
          build_args:
            - NOVA_INCUS_REF=866d7e20a82e0a8502dc84e8822bc840eae07ec0

# Nova compute image for the Kata Containers driver (openstack-nova-kata,
# ADR-056), and the host bundle its nodes install. Both are pinned together:
# driver, gateway, snapshotter and shim are one unit.
- job:
    name: build-local-nova-kata
    description: Build the Nova Kata Containers compute image.
    vars:
      container_images:
        - context: .
          repository: openstackhelm/nova-kata
          container_filename: nova/Dockerfile.kata
          arch:
            - linux/amd64
          tags:
            - 2026.2-alpine_3.24
          build_args:
            - NOVA_REF=8df1922926ddf949d681e10670dba7bc731701d3
            - NOVA_KATA_REF=9d09cfdf195a3654cea458f4ea4eb471accab28c
            - REQUIREMENTS_REF=bab6cd8e3b9a5ac61b98aa7016c7d98b3000a8ac

- job:
    name: build-local-nova-kata-host
    description: Build the Nova Kata host bundle and installer image.
    vars:
      container_images:
        - context: .
          repository: openstackhelm/nova-kata-host
          container_filename: nova/Dockerfile.kata-host
          arch:
            - linux/amd64
          tags:
            - 2026.2-20261029
          build_args:
            - NOVA_KATA_REF=5ed053db2be21749b6a91df012c95a363456dc3b
            - NOVA_KATA_BUNDLE_TAG=20261029
            - NOVA_KATA_BUNDLE_SHA256=ae3c0641868e85f05a07e57042a25f8c1bcb3152973784fb1297dd6f340517a5
