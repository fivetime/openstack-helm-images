---
# Fork-only Nova compute image for the external Incus system-container driver.
# The Incus daemon runs in its own privileged Helm DaemonSet; this image
# contains only Nova, the driver, its SDK, patches, and integration tools.

- job:
    name: build-local-nova-incus
    description: Build the Nova Incus system-container compute image.
    vars:
      container_images:
        - context: nova
          repository: openstackhelm/nova-incus
          container_filename: Dockerfile.incus
          arch:
            - linux/amd64
            - linux/arm64
          tags:
            - 2026.1-alpine_3.23
          build_args:
            - NOVA_REF=8595b8eed4d0cabf6a7db04b0d946cf764187965
            - NOVA_INCUS_REF=cb5ba1ba4753fe4984ad8ab215878c9ec8de9eae
            - INCUS_SDK_REF=4078fd46ae955e87c2fbd8eb3e75a283c60a594b
            - REQUIREMENTS_REF=06cd4e8523cbade25fb93efc4f8ea77d6d97064f

- job:
    name: build-local-nova-incus-control
    description: Add the Incus RPC and Manila contracts to the Nova control image.
    vars:
      container_images:
        - context: nova
          repository: openstackhelm/nova-incus-control
          container_filename: Dockerfile.incus-control
          arch:
            - linux/amd64
          tags:
            - 2026.1-ubuntu_noble
          build_args:
            - NOVA_INCUS_REF=cb5ba1ba4753fe4984ad8ab215878c9ec8de9eae
