- job:
    name: build-local-openstack-exporter
    vars:
      container_images:
        - context: openstack-exporter
          repository: openstackhelm/openstack-exporter
          container_filename: Dockerfile
          arch: [linux/amd64, linux/arm64]
          tags: [latest]
          build_args:
            - OPENSTACK_EXPORTER_REF=52f9647566c9efa2381e6e22b4ef4dc050fc00c0
