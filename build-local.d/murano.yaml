---
# Fork-only Murano (Application Catalog) image. Murano is retired upstream;
# fivetime/openstack-murano carries it on 2026.2 with native threads instead
# of eventlet, along with fivetime/python-muranoclient and
# fivetime/murano-pkg-check, which murano-engine downloads the packages with.
# One image for murano-api (a WSGI application under uWSGI) and
# murano-engine. Built only for 2026.2 (Python 3.14, Ubuntu 26.04).

- job:
    name: build-local-murano
    description: Build the Murano image from the forks' release tags.
    vars:
      container_images:
        - context: .
          repository: openstackhelm/murano
          container_filename: murano/Dockerfile
          synthesize_master: false
          arch:
            - linux/amd64
          tags:
            - 2026.2-ubuntu_resolute
          build_args:
            - BASE_VENV_BUILDER=quay.io/airshipit/venv_builder:2026.2-ubuntu_resolute
            - BASE_RUNTIME=quay.io/airshipit/base:2026.2-ubuntu_resolute
            - MURANO_REPO=https://github.com/fivetime/openstack-murano
            # The repositories are private: name the release tags (or
            # commits) to build. Bump them to build newer code.
            - MURANO_REF=17.0.0
            - MURANOCLIENT_REPO=https://github.com/fivetime/python-muranoclient
            - MURANOCLIENT_REF=3.0.0
            - MURANOPKGCHECK_REPO=https://github.com/fivetime/murano-pkg-check
            - MURANOPKGCHECK_REF=0.4.0
