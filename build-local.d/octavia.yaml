---
# Fork-only Octavia Alpine controller image. The Dockerfile installs Octavia
# and ovn-octavia-provider from matching branches, plus PostgreSQL and Kafka
# drivers. Those packages are explicit in Dockerfile.alpine, so the generated
# pydep.txt overlay used by the standard Ubuntu image is intentionally unused.

- job:
    name: build-local-octavia-alpine
    description: Build Octavia Alpine with OVN, PostgreSQL, and Kafka drivers.
    vars:
      container_images:
        # --include-master synthesizes master-alpine_3.23 from this row and
        # rewrites all stable/2026.1 source and constraints arguments together.
        - context: octavia
          repository: openstackhelm/octavia
          container_filename: Dockerfile.alpine
          arch:
            - linux/amd64
            - linux/arm64
          tags:
            - 2026.1-alpine_3.23
          build_args:
            - OCTAVIA_REF=stable/2026.1
            - OVN_PROVIDER_REF=stable/2026.1
            # 私有仓库,钉 commit;与 Dockerfile 的 ARG 默认值由
            # PINNED_BUILD_ARGS 强制一致。发版时两处同改。
            - INCUS_PROVIDER_REF=8e34dd0e97909fc4253d4b7660a37d6e5c3b9d46
            - CONSTRAINTS=https://opendev.org/openstack/requirements/raw/branch/stable/2026.1/upper-constraints.txt
