---
# Fork-only neutron Alpine variant. Upstream zuul.d/neutron.yaml builds only the
# Dockerfile (venv/loci) ubuntu_noble variants. This entry adds an Alpine variant
# built from opendev neutron and ships ovsdb_dns_patch (neutron/patches/ovsdb_dns.py)
# -- a synchronous getaddrinfo replacement for ovs.dns_resolve.resolve.
#
# Why: the stock python `ovs` library only resolves DNS via the (async) unbound
# library, so a one-shot OVSDB connect to a hostname fails and ovn_nb_connection
# has to be a bare IP (a single LB/ClusterIP VIP). A single VIP hides the RAFT
# members, so a leader_only client lands on a follower and flaps
# ("not cluster leader; trying another server"). With the patch, neutron-server
# and neutron-ovn-agent can use the full per-pod RAFT member list (DNS names) ->
# follow the leader, no flap, and survive pod migration (re-resolve the FQDN).
#
# It is FROM alpine:<ALPINE_VERSION> (3.24) and takes ovs-vsctl / ovsdb tooling
# from Alpine's openvswitch package. It used to be layered on the fork's
# ovn:alpine_latest for those tools, which tied neutron's Alpine release to the
# one the production OVN runs. vtysh comes from the fork's frr image
# (build-local.d/frr.yaml), the same FRR build the chart runs; same
# one-build-lag ordering caveat as before: FRR_IMAGE resolves to the
# previously published frr image, so build frr first when bumping it.

- job:
    name: build-local-neutron-alpine
    description: Build fork-only neutron Alpine variant (adds synchronous OVSDB DNS patch).
    vars:
      container_images:
        # Two cells, both written out (neither is synthesized from the other):
        #   * 2026.2-alpine_3.24 -- source stable/2026.2, DETERMINISTIC, built
        #     only on dispatch/release.
        #   * master-alpine_3.24 -- source neutron master, built DAILY by cron;
        #     the moving "latest", and what production runs: as of 2026-10-06
        #     the EVPN/SVD fixes merged to master after the 2026.2 branch point
        #     (SVD idempotency, static route redistribution, FSM refactor, ...)
        #     were not backported, and the OVN agent's ovn-evpn extension is in
        #     use. Move production to the 2026.2 cell once they are.
        # It used to be one 2026.1 entry from which --include-master synthesized
        # the master cell; synthesize_master only derives from 2026.1 entries,
        # so with the release at 2026.2 the master cell is its own entry.
        #
        # Neutron itself comes from opendev (the Dockerfile's NEUTRON_REPO
        # default). It used to point NEUTRON_REPO at the fivetime fork, but by
        # 2026-10-05 the fork carried no change of its own; the changes we do
        # carry are patches (neutron/patches/neutron), applied in the image. For
        # a reproducible image, pin NEUTRON_REF to a tag/sha and FRR_IMAGE to a
        # digest. CONSTRAINTS must follow NEUTRON_REF: neutron master needs a
        # newer neutron-lib than a stable branch's constraints allow.
        - context: neutron
          repository: openstackhelm/neutron
          container_filename: Dockerfile.alpine
          arch:
            - linux/amd64
            - linux/arm64
          tags:
            - 2026.2-alpine_3.24
          build_args:
            - NEUTRON_REF=stable/2026.2
            - CONSTRAINTS=https://opendev.org/openstack/requirements/raw/branch/stable/2026.2/upper-constraints.txt
            # networking-baremetal 只有 master 带 L2VNI mechanism driver(fork 自有),
            # 上游最新 stable 才到 2025.2。两个 cell 都用 master。
            - NETWORKING_BAREMETAL_REPO=https://github.com/fivetime/networking-baremetal.git
            - NETWORKING_BAREMETAL_REF=master
            # networking-generic-switch 同理:fork 只有 master。
            - NETWORKING_GENERIC_SWITCH_REPO=https://github.com/fivetime/networking-generic-switch.git
            - NETWORKING_GENERIC_SWITCH_REF=master
        - context: neutron
          repository: openstackhelm/neutron
          container_filename: Dockerfile.alpine
          arch:
            - linux/amd64
            - linux/arm64
          tags:
            - master-alpine_3.24
          build_args:
            - NEUTRON_REF=master
            - CONSTRAINTS=https://opendev.org/openstack/requirements/raw/branch/master/upper-constraints.txt
            # networking-baremetal 只有 master 带 L2VNI mechanism driver(fork 自有),
            # 上游最新 stable 才到 2025.2。两个 cell 都用 master。
            - NETWORKING_BAREMETAL_REPO=https://github.com/fivetime/networking-baremetal.git
            - NETWORKING_BAREMETAL_REF=master
            # networking-generic-switch 同理:fork 只有 master。
            - NETWORKING_GENERIC_SWITCH_REPO=https://github.com/fivetime/networking-generic-switch.git
            - NETWORKING_GENERIC_SWITCH_REF=master
