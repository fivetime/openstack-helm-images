---
# Fork-only Horizon (kolla base + the plugins kolla leaves out). The kolla
# 2026.1 horizon image ships most dashboard plugins but not zun-ui,
# barbican-ui, freezer-web-ui or zaqar-ui, and the airshipit loci image ships
# none; this derives from the kolla base and adds those four so extra_panels
# can enable them. upper-constraints pins no horizon plugin at all, so the
# four are pinned in the Dockerfile by hand -- bump them with the release.
# amd64 only: it tracks the kolla base image's published architectures.

- job:
    name: build-local-horizon-kolla
    description: Build kolla-based Horizon image with the missing dashboard plugins added.
    vars:
      container_images:
        - context: .
          repository: openstackhelm/horizon-kolla
          container_filename: horizon-kolla/Dockerfile
          arch:
            - linux/amd64
          tags:
            - 2026.1-ubuntu-noble
          build_args:
            - BASE=quay.io/openstack.kolla/horizon:2026.1-ubuntu-noble
            - RELEASE=2026.1
            # raas-ui is private and pinned by commit; must equal the
            # Dockerfile's ARG default (PINNED_BUILD_ARGS enforces it).
            - RAAS_UI_REF=3aab9567ae54942a74b5417331c5553ededa0192
            # daas-ui: same rules as raas-ui (private, pinned by commit).
            - DAAS_UI_REF=4e1991393b745d4c9818f613b0c21061357c680f
        # 2026.2: kolla publishes only ubuntu-noble (Python 3.12) for Horizon,
        # no resolute. The base moves to horizon 27 and Django 5.2, so every
        # plugin added here has to be checked against Django 5.2.
        - context: .
          repository: openstackhelm/horizon-kolla
          container_filename: horizon-kolla/Dockerfile
          arch:
            - linux/amd64
          tags:
            - 2026.2-ubuntu-noble
          build_args:
            - BASE=quay.io/openstack.kolla/horizon:2026.2-ubuntu-noble
            - RELEASE=2026.2
            # 2026.2 releases of the two PyPI plugins
            - FREEZER_WEB_UI_VERSION=19.0.0
            - ZAQAR_UI_VERSION=21.0.0
            # barbican-ui has only master; latest commit at the 2026.2 bump
            - BARBICAN_UI_REF=3285e42b0297802bf74270fa755ee6be514f8dc7
            - RAAS_UI_REF=3aab9567ae54942a74b5417331c5553ededa0192
            - DAAS_UI_REF=4e1991393b745d4c9818f613b0c21061357c680f
