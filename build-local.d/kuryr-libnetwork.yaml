---
# Fork-only Kuryr-libnetwork (Docker libnetwork driver) image. Upstream openstack-helm-images has
# no kuryr-libnetwork; we build a loci-style image from stable/2026.1 so the generated
# pydep overlay injects psycopg2-binary and confluent-kafka automatically
# (kuryr-libnetwork has no oslo.messaging; pydep adds nothing, which is correct).

- job:
    name: build-local-kuryr-libnetwork
    description: Build Zun ubuntu_noble image from upstream stable branch.
    vars:
      container_images:
        - context: .
          repository: openstackhelm/kuryr-libnetwork
          container_filename: kuryr-libnetwork/Dockerfile
          arch:
            - linux/amd64
            - linux/arm64
          tags:
            - 2026.1-ubuntu_noble
          build_args:
            - BASE_VENV_BUILDER=quay.io/airshipit/venv_builder:2026.1-ubuntu_noble
            - BASE_RUNTIME=quay.io/airshipit/base:2026.1-ubuntu_noble
            - KURYR_LIBNETWORK_REF=stable/2026.1
