---
# Base images for Incus OCI system images (contract incus-oci-system-v1).
# They are build inputs only: the Nova Incus publisher flattens a derived
# image into an ordinary Incus system image for Glance, so no Nova guest
# runs these tags directly.

- job:
    name: build-local-incus-system-base
    description: Build the Ubuntu 24.04 base for Incus OCI system images.
    vars:
      container_images:
        - context: incus-system
          repository: openstackhelm/incus-system-base
          container_filename: Dockerfile.ubuntu_noble
          arch:
            - linux/amd64
            - linux/arm64
          tags:
            - ubuntu_noble
          synthesize_master: false

- job:
    name: build-local-incus-system-trove-docker
    description: >-
      Example derived Incus OCI system image: the base plus Docker, containerd
      and AppArmor for Trove guests in Flavor-granted nesting instances.
    vars:
      container_images:
        - context: incus-system
          repository: openstackhelm/incus-system-trove-docker
          container_filename: Dockerfile.trove-docker
          arch:
            - linux/amd64
            - linux/arm64
          tags:
            - ubuntu_noble
          synthesize_master: false
