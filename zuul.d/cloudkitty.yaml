- job:
    name: openstack-helm-images-build-cloudkitty
    parent: openstack-helm-images-build
    description: Build cloudkitty images
    nodeset: openstack-helm-images-ubuntu-noble
    dependencies:
      - name: openstack-helm-images-buildset-registry
      - name: openstack-helm-images-build-base
        soft: true
      - name: openstack-helm-images-build-venv-builder
        soft: true
    vars: &cloudkitty_vars
      currentdate: "{{ now(utc=True,fmt='%Y%m%d') }}"
      container_images:
        - context: .
          registry: quay.io
          repository: quay.io/airshipit/cloudkitty
          container_filename: cloudkitty/Dockerfile
          arch:
            - linux/amd64
            - linux/arm64
          tags:
            - "2025.1-ubuntu_noble"
            - "2025.1-ubuntu_noble-{{ currentdate }}"
          build_args:
            - "BASE_VENV_BUILDER=quay.io/airshipit/venv_builder:2025.1-ubuntu_noble"
            - "BASE_RUNTIME=quay.io/airshipit/base:2025.1-ubuntu_noble"
            - "CLOUDKITTY_REF=stable/2025.1"
        - context: .
          registry: quay.io
          repository: quay.io/airshipit/cloudkitty
          container_filename: cloudkitty/Dockerfile
          arch:
            - linux/amd64
            - linux/arm64
          tags:
            - "2025.2-ubuntu_noble"
            - "2025.2-ubuntu_noble-{{ currentdate }}"
          build_args:
            - "BASE_VENV_BUILDER=quay.io/airshipit/venv_builder:2025.2-ubuntu_noble"
            - "BASE_RUNTIME=quay.io/airshipit/base:2025.2-ubuntu_noble"
            - "CLOUDKITTY_REF=stable/2025.2"
        - context: .
          registry: quay.io
          repository: quay.io/airshipit/cloudkitty
          container_filename: cloudkitty/Dockerfile
          arch:
            - linux/amd64
            - linux/arm64
          tags:
            - "2026.1-ubuntu_noble"
            - "2026.1-ubuntu_noble-{{ currentdate }}"
          build_args:
            - "BASE_VENV_BUILDER=quay.io/airshipit/venv_builder:2026.1-ubuntu_noble"
            - "BASE_RUNTIME=quay.io/airshipit/base:2026.1-ubuntu_noble"
            # Build from our fork's 2026.1-fivetime.1 tag, which is opendev's
            # stable/2026.1 (f5d0186) plus the InfluxDB v2 None-handling fix.
            # Without it GET /v2/dataframes (no filters) returns 500 and
            # PUT /v2/scope never resets a scope -- both unfixed on opendev
            # master as of 2026-08-25.
            # A tag, not a branch: the fork keeps a single branch that tracks
            # upstream master, and an immutable ref is what a release build
            # wants anyway. Drop this override once the fix lands upstream.
            - "CLOUDKITTY_REPO=https://github.com/fivetime/openstack-cloudkitty"
            - "CLOUDKITTY_REF=2026.1-fivetime.1"
    files: &cloudkitty_files
      - cloudkitty/.*
      - zuul.d/cloudkitty.yaml
      - roles/.*
      - playbooks/.*

- job:
    name: openstack-helm-images-upload-cloudkitty
    parent: openstack-helm-images-upload
    description: Build and upload cloudkitty images
    dependencies:
      - name: openstack-helm-images-buildset-registry
      - name: openstack-helm-images-build-cloudkitty
    vars: *cloudkitty_vars
    files: *cloudkitty_files

- job:
    name: openstack-helm-images-promote-cloudkitty
    parent: openstack-helm-images-promote
    description: Promote a previously published cloudkitty image to latest.
    vars: *cloudkitty_vars
    files: *cloudkitty_files
