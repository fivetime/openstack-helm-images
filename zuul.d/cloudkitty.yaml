- job:
    name: openstack-helm-images-build-cloudkitty
    parent: openstack-helm-images-build
    description: Build cloudkitty images
    nodeset: openstack-helm-images-ubuntu-noble
    dependencies:
      - name: openstack-helm-images-buildset-registry
      - name: openstack-helm-images-build-base
        soft: true
      - name: openstack-helm-images-build-venv-builder
        soft: true
    vars: &cloudkitty_vars
      currentdate: "{{ now(utc=True,fmt='%Y%m%d') }}"
      container_images:
        - context: .
          registry: quay.io
          repository: quay.io/airshipit/cloudkitty
          container_filename: cloudkitty/Dockerfile
          arch:
            - linux/amd64
          tags:
            - "2025.2-ubuntu_noble"
            - "2025.2-ubuntu_noble-{{ currentdate }}"
          build_args:
            - "BASE_VENV_BUILDER=quay.io/airshipit/venv_builder:2025.2-ubuntu_noble"
            - "BASE_RUNTIME=quay.io/airshipit/base:2025.2-ubuntu_noble"
            - "CLOUDKITTY_REF=stable/2025.2"
        - context: .
          registry: quay.io
          repository: quay.io/airshipit/cloudkitty
          container_filename: cloudkitty/Dockerfile
          arch:
            - linux/amd64
          tags:
            - "2026.1-ubuntu_noble"
            - "2026.1-ubuntu_noble-{{ currentdate }}"
          build_args:
            - "BASE_VENV_BUILDER=quay.io/airshipit/venv_builder:2026.1-ubuntu_noble"
            - "BASE_RUNTIME=quay.io/airshipit/base:2026.1-ubuntu_noble"
            # This cell is tagged 2026.1 but its content is cloudkitty
            # master, from the fivetime fork: opendev master plus the three
            # InfluxDB v2 fixes. Without them GET /v2/dataframes (no filters)
            # returns 500 and PUT /v2/scope never resets a scope -- both still
            # unfixed upstream as of 2026-10-05. The fork's 2026.1-fivetime
            # branch, which carried the same fixes on top of opendev's
            # stable/2026.1, was merged into the fork's master and deleted on
            # 2026-10-05, so master is the only branch the fork has.
            # Master's requirements all fit the 2026.1 upper-constraints, so
            # it builds on the 2026.1 base.
            # It has to be a branch, not a tag: cloudkitty builds with pbr,
            # which derives the package version from git tags via
            # max(tags, key=parse_version) and dies on anything that is not
            # PEP 440 (`2026.1-fivetime.2` -> InvalidVersion). Keep this fork
            # free of tags. Drop the two build args below once the fixes land
            # upstream.
            - "CLOUDKITTY_REPO=https://github.com/fivetime/openstack-cloudkitty"
            - "CLOUDKITTY_REF=master"
            - "CLOUDKITTY_REF_URL=https://api.github.com/repos/fivetime/openstack-cloudkitty/git/refs/heads/master"
        - context: .
          registry: quay.io
          repository: quay.io/airshipit/cloudkitty
          container_filename: cloudkitty/Dockerfile
          arch:
            - linux/amd64
          tags:
            - "2026.2-ubuntu_resolute"
            - "2026.2-ubuntu_resolute-{{ currentdate }}"
          build_args:
            - "BASE_VENV_BUILDER=quay.io/airshipit/venv_builder:2026.2-ubuntu_resolute"
            - "BASE_RUNTIME=quay.io/airshipit/base:2026.2-ubuntu_resolute"
            # The fork's fivetime/stable/2026.2 branch: opendev's
            # stable/2026.2 plus the InfluxDB v2 fixes above, as submitted to
            # Gerrit (1008743-1008746). Drop these three build args once they
            # land upstream and are backported.
            - "CLOUDKITTY_REPO=https://github.com/fivetime/openstack-cloudkitty"
            - "CLOUDKITTY_REF=fivetime/stable/2026.2"
            - "CLOUDKITTY_REF_URL=https://api.github.com/repos/fivetime/openstack-cloudkitty/git/refs/heads/fivetime/stable/2026.2"
    files: &cloudkitty_files
      - cloudkitty/.*
      - zuul.d/cloudkitty.yaml
      - roles/.*
      - playbooks/.*
      # Built on top of the base and venv_builder images, and the Dockerfile
      # reads its system and python package lists from bindep.txt/pydep.txt.
      - base/.*
      - zuul.d/base.yaml
      - venv_builder/.*
      - zuul.d/venv_builder.yaml
      - bindep.txt
      - pydep.txt

- job:
    name: openstack-helm-images-upload-cloudkitty
    parent: openstack-helm-images-upload
    description: Build and upload cloudkitty images
    dependencies:
      - name: openstack-helm-images-buildset-registry
      - name: openstack-helm-images-build-cloudkitty
    vars: *cloudkitty_vars
    files: *cloudkitty_files

- job:
    name: openstack-helm-images-promote-cloudkitty
    parent: openstack-helm-images-promote
    description: Promote a previously published cloudkitty image to latest.
    vars: *cloudkitty_vars
    files: *cloudkitty_files
