- job:
    name: openstack-helm-images-build-gnocchi
    parent: openstack-helm-images-build
    description: Build gnocchi images
    nodeset: openstack-helm-images-ubuntu-noble
    dependencies:
      - name: openstack-helm-images-buildset-registry
      - name: openstack-helm-images-build-base
        soft: true
      - name: openstack-helm-images-build-venv-builder
        soft: true
    vars: &gnocchi_vars
      currentdate: "{{ now(utc=True,fmt='%Y%m%d') }}"
      container_images:
        - context: .
          registry: quay.io
          repository: quay.io/airshipit/gnocchi
          container_filename: gnocchi/Dockerfile
          arch:
            - linux/amd64
            - linux/arm64
          tags:
            - "2025.2-ubuntu_noble"
            - "2025.2-ubuntu_noble-{{ currentdate }}"
          build_args:
            - "BASE_VENV_BUILDER=quay.io/airshipit/venv_builder:2025.2-ubuntu_noble"
            - "BASE_RUNTIME=quay.io/airshipit/base:2025.2-ubuntu_noble"
            - "GNOCCHI_REF=4.7.0"
        - context: .
          registry: quay.io
          repository: quay.io/airshipit/gnocchi
          container_filename: gnocchi/Dockerfile
          arch:
            - linux/amd64
            - linux/arm64
          tags:
            - "2026.1-ubuntu_noble"
            - "2026.1-ubuntu_noble-{{ currentdate }}"
          build_args:
            - "BASE_VENV_BUILDER=quay.io/airshipit/venv_builder:2026.1-ubuntu_noble"
            - "BASE_RUNTIME=quay.io/airshipit/base:2026.1-ubuntu_noble"
            - "GNOCCHI_REF=4.7.0"
    files: &gnocchi_files
      - gnocchi/.*
      - zuul.d/gnocchi.yaml
      - roles/.*
      - playbooks/.*

- job:
    name: openstack-helm-images-upload-gnocchi
    parent: openstack-helm-images-upload
    description: Build and upload gnocchi images
    dependencies:
      - name: openstack-helm-images-buildset-registry
      - name: openstack-helm-images-build-gnocchi
    vars: *gnocchi_vars
    files: *gnocchi_files

- job:
    name: openstack-helm-images-promote-gnocchi
    parent: openstack-helm-images-promote
    description: Promote a previously published gnocchi image to latest.
    vars: *gnocchi_vars
    files: *gnocchi_files
