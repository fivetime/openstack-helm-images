- job:
    name: openstack-helm-images-build-ceilometer
    parent: openstack-helm-images-build
    description: Build ceilometer images
    nodeset: openstack-helm-images-ubuntu-noble
    dependencies:
      - name: openstack-helm-images-buildset-registry
      - name: openstack-helm-images-build-base
        soft: true
      - name: openstack-helm-images-build-venv-builder
        soft: true
    vars: &ceilometer_vars
      currentdate: "{{ now(utc=True,fmt='%Y%m%d') }}"
      container_images:
        - context: .
          registry: quay.io
          repository: quay.io/airshipit/ceilometer
          container_filename: ceilometer/Dockerfile
          arch:
            - linux/amd64
          tags:
            - "2025.2-ubuntu_noble"
            - "2025.2-ubuntu_noble-{{ currentdate }}"
          build_args:
            - "BASE_VENV_BUILDER=quay.io/airshipit/venv_builder:2025.2-ubuntu_noble"
            - "BASE_RUNTIME=quay.io/airshipit/base:2025.2-ubuntu_noble"
            - "CEILOMETER_REF=stable/2025.2"
        - context: .
          registry: quay.io
          repository: quay.io/airshipit/ceilometer
          container_filename: ceilometer/Dockerfile
          arch:
            - linux/amd64
          tags:
            - "2026.1-ubuntu_noble"
            - "2026.1-ubuntu_noble-{{ currentdate }}"
          build_args:
            - "BASE_VENV_BUILDER=quay.io/airshipit/venv_builder:2026.1-ubuntu_noble"
            - "BASE_RUNTIME=quay.io/airshipit/base:2026.1-ubuntu_noble"
            # This cell is tagged 2026.1 but its content is ceilometer
            # master. The fork's stable/2026.1 branch, which carried the
            # volume_provider_pool ``provider`` metadata fix (see
            # ceilometer/Dockerfile) on top of upstream's release branch, was
            # merged into master and deleted on 2026-10-05, so master is the
            # only branch the fork has left. Note that upstream moved the
            # volume pollsters from cinderclient to openstacksdk after
            # 2026.1, so a pool is now a cinder_stats.Pools with its driver
            # fields in a nested capabilities dict; the fix is adapted to
            # that on master. The master row is synthesized from this entry
            # and lands on the same ref.
            #
            # Master also switches the default cinder service type from
            # volumev3 to block-storage (49463a05). That needs no catalog or
            # config change: block-storage is the official type in the
            # service-types authority and volumev3 one of its aliases, and
            # keystoneauth resolves aliases, so asking for block-storage
            # against a catalog that registers volumev3 returns the same
            # endpoint. Checked against this deployment's live catalog with
            # the built image's own keystoneauth.
            - "CEILOMETER_REPO=https://github.com/fivetime/openstack-ceilometer"
            - "CEILOMETER_REF=master"
            # The cache-busting ADD has to follow the repo, not just the ref.
            - "CEILOMETER_REF_URL=https://api.github.com/repos/fivetime/openstack-ceilometer/git/refs/heads/master"
        - context: .
          registry: quay.io
          repository: quay.io/airshipit/ceilometer
          container_filename: ceilometer/Dockerfile
          arch:
            - linux/amd64
          tags:
            - "2026.2-ubuntu_resolute"
            - "2026.2-ubuntu_resolute-{{ currentdate }}"
          build_args:
            - "BASE_VENV_BUILDER=quay.io/airshipit/venv_builder:2026.2-ubuntu_resolute"
            - "BASE_RUNTIME=quay.io/airshipit/base:2026.2-ubuntu_resolute"
            - "CEILOMETER_REF=stable/2026.2"
    files: &ceilometer_files
      - ceilometer/.*
      - zuul.d/ceilometer.yaml
      - roles/.*
      - playbooks/.*
      # Built on top of the base and venv_builder images, and the Dockerfile
      # reads its system and python package lists from bindep.txt/pydep.txt.
      - base/.*
      - zuul.d/base.yaml
      - venv_builder/.*
      - zuul.d/venv_builder.yaml
      - bindep.txt
      - pydep.txt

- job:
    name: openstack-helm-images-upload-ceilometer
    parent: openstack-helm-images-upload
    description: Build and upload ceilometer images
    dependencies:
      - name: openstack-helm-images-buildset-registry
      - name: openstack-helm-images-build-ceilometer
    vars: *ceilometer_vars
    files: *ceilometer_files

- job:
    name: openstack-helm-images-promote-ceilometer
    parent: openstack-helm-images-promote
    description: Promote a previously published ceilometer image to latest.
    vars: *ceilometer_vars
    files: *ceilometer_files
